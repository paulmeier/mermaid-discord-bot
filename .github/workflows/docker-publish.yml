name: Build validation (PR)

# Validates that the Docker image builds successfully on every pull request
# targeting main. No image is pushed. Releases and pushes are handled by
# .github/workflows/release.yml which runs on merge to main.

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Validate Docker build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

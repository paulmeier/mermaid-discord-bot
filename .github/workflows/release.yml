name: Release

# Runs on every push to main.
# Step 1 — semantic-release: inspects conventional commits since the last
#           release, computes the next SemVer, updates CHANGELOG.md, creates
#           a git tag, and publishes a GitHub Release.
# Step 2 — docker: if a new version was actually cut, builds a multi-arch
#           Docker image and pushes all tags to Docker Hub.
#
# Both jobs live here so they share a single workflow run and we avoid the
# GITHUB_TOKEN cross-workflow trigger restriction.

on:
  push:
    branches:
      - main

jobs:
  # ── Job 1: semantic versioning ───────────────────────────────────────────────
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push changelog commit + create tag
      issues: write          # close issues referenced in commits
      pull-requests: write   # comment on merged PRs

    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version:   ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout (full history required by semantic-release)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # cycjimmy/semantic-release-action wraps the semantic-release CLI and
      # exposes new_release_published / new_release_version as step outputs.
      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          # Extra plugins not bundled with semantic-release itself
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 2: Docker build & push ───────────────────────────────────────────────
  docker:
    name: Build and push Docker image
    needs: release
    # Only run when semantic-release actually cut a new version
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout at the new release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.new_release_version }}

      # Produces all relevant Docker tags, e.g. for version 1.2.3:
      #   :1.2.3   :1.2   :1   :latest
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mermaid-discord-bot
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.new_release_version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.new_release_version }}
            type=semver,pattern={{major}},value=v${{ needs.release.outputs.new_release_version }}
            type=raw,value=latest

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/mermaid-discord-bot
          readme-filepath: ./README.md
